<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Detector ✨</title>
    <meta name="description" content="Hold up your perfume and let AI identify it! Powered by Teachable Machine.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">
                <span class="title-icon">🌸</span>
                Perfume Detector
                <span class="title-icon">✨</span>
            </h1>
            <p class="subtitle">hold up your perfume &amp; let the magic happen</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Webcam Section -->
            <div class="webcam-section">
                <div class="webcam-container" id="webcam-container">
                    <div class="webcam-placeholder" id="webcam-placeholder">
                        <div class="placeholder-content">
                            <span class="placeholder-emoji">📷</span>
                            <p>loading camera...</p>
                        </div>
                    </div>
                    <canvas id="webcam-canvas"></canvas>
                    <div class="webcam-glow"></div>
                </div>
            </div>

            <!-- Prediction Bars -->
            <div class="predictions-section">
                <h2 class="predictions-title">live detection</h2>
                <div class="predictions-container" id="predictions-container">
                    <!-- Bars will be injected by JS -->
                </div>
            </div>
        </main>

        <!-- Perfume Popup -->
        <div class="perfume-popup" id="perfume-popup">
            <div class="popup-inner">
                <div class="popup-emoji" id="popup-emoji">🌹</div>
                <h2 class="popup-name" id="popup-name"></h2>
                <p class="popup-note" id="popup-note"></p>

            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">warming up the AI nose...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
